name: Terraform Validation (Chaos Module)

on:
  # Allow manual trigger
  workflow_dispatch:

  # Run on PR affecting the Terraform config
  pull_request:
    paths:
      - '**.tf'
      - '.github/workflows/e2e-chaos-tests.yml'

# Validation only reads the repo; it neither deploys nor comments on PRs, so no
# extra GITHUB_TOKEN scopes (and no Harness credentials) are required.
permissions:
  contents: read

env:
  TF_VERSION: '1.5.0'

jobs:
  terraform-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
